<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Anti-flicker Whitemode / Darkmode Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('schoolcal_user_settings');
          var isDark = false;
          if (saved) {
            var s = JSON.parse(saved);
            if (s.theme === 'light') {
              isDark = false;
            } else if (s.theme === 'dark') {
              isDark = true;
            } else {
              isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- iOS WebApp Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SchoolCal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <title>SchoolCal – Digitaler Schulplaner & Kalender</title>
  </head>
  <body class="bg-ios-light-bg dark:bg-ios-dark-bg text-slate-900 dark:text-white antialiased selection:bg-ios-blue selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
