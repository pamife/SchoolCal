<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS WebApp Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SchoolCal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <title>SchoolCal – Digitaler Schulplaner & Kalender</title>

    <style>
      /* Prevent Netlify Drawer badge from covering mobile navigation bar */
      #netlify-drawer,
      iframe[data-netlify-drawer],
      [data-netlify-drawer],
      .netlify-drawer-root,
      netlify-drawer,
      #netlify-badge,
      [data-netlify-deploy-id],
      div[class*="netlify-drawer"],
      div[id*="netlify-drawer"],
      [class*="feedback-drawer"],
      [id*="feedback-drawer"],
      [aria-label*="Netlify Drawer"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
  </head>
  <body class="bg-ios-light-bg dark:bg-ios-dark-bg text-slate-900 dark:text-white antialiased selection:bg-ios-blue selection:text-white">
    <div id="root" class="min-h-[100dvh] w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
